<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>로또 번호 추천기</title>
	<style>
		body {
			font-family: 'Segoe UI', Arial, sans-serif;
			background: linear-gradient(135deg, #f8ffae 0%, #43c6ac 100%);
			min-height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		.container {
			background: rgba(255,255,255,0.95);
			padding: 2rem 2.5rem;
			border-radius: 1.5rem;
			box-shadow: 0 4px 24px rgba(0,0,0,0.08);
			text-align: center;
		}
		h1 {
			color: #2d3a4b;
			margin-bottom: 1.5rem;
		}
		.numbers {
			display: flex;
			justify-content: center;
			gap: 1rem;
			margin: 2rem 0 1.5rem 0;
		}
		.ball {
			width: 48px;
			height: 48px;
			background: #43c6ac;
			color: #fff;
			font-size: 1.5rem;
			font-weight: bold;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 2px 8px rgba(67,198,172,0.2);
			transition: background 0.2s;
		}
		.ball:nth-child(2n) { background: #f8ffae; color: #2d3a4b; }
		.ball:nth-child(3n) { background: #ffb347; color: #fff; }
		.ball:nth-child(4n) { background: #ff5e62; color: #fff; }
		.ball:nth-child(5n) { background: #4a90e2; color: #fff; }
		.ball:nth-child(6n) { background: #7b4397; color: #fff; }
		button {
			background: #43c6ac;
			color: #fff;
			border: none;
			border-radius: 2rem;
			padding: 0.8rem 2.2rem;
			font-size: 1.1rem;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0 2px 8px rgba(67,198,172,0.15);
			transition: background 0.2s;
		}
		button:hover {
			background: #2d3a4b;
		}
		.desc {
			color: #555;
			font-size: 1rem;
			margin-bottom: 2rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>로또 번호 추천기</h1>
		<div class="desc">버튼을 누르면 1~45 사이의 중복 없는 6개 번호를 추천해드립니다.</div>
		<div class="numbers" id="numbers">
			<!-- 추천 번호가 여기에 표시됩니다 -->
		</div>
		<button onclick="generateLotto()">번호 추천받기</button>
	</div>
	<script>
		function generateLotto() {
			const numbers = [];
			while (numbers.length < 6) {
				const n = Math.floor(Math.random() * 45) + 1;
				if (!numbers.includes(n)) numbers.push(n);
			}
			numbers.sort((a, b) => a - b);
			const numbersDiv = document.getElementById('numbers');
			numbersDiv.innerHTML = numbers.map(num => `<div class='ball'>${num}</div>`).join('');
		}
		// 페이지 로드시 자동 추천
		window.onload = generateLotto;
	</script>
</body>
</html>
